  <title id="t">Generation speed in tokens per second (higher is better)</title>
  <desc id="d">Horizontal bar chart of generation speed in tokens per second: qwen3:8b on Ollama ~89; gpt-oss:20b on Ollama ~113; Qwen3 8B Q4_K_M on llama.cpp ~101; Gemma 4 26B-A4B on llama.cpp, --cpu-moe ~34; Gemma 4 26B-A4B on llama.cpp, --fit-target 1024 ~76.</desc>
