name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: README tables and chart match results/
        run: python tools/render_results.py --check

  powershell:
    name: PowerShell parse and PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse every script with the PowerShell parser
        shell: powershell
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem -Path . -Filter '*.ps1' -Recurse) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              $bad++
              foreach ($e in $errs) { Write-Host "$($file.FullName):$($e.Extent.StartLineNumber): $($e.Message)" }
            } else {
              Write-Host "parsed $($file.Name)"
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Lint with PSScriptAnalyzer (Error and Warning)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host is deliberate in these interactive console scripts: they print coloured status lines.
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost)
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 250 | Write-Host
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: no Error or Warning findings.'
      - name: Python tests that run the PowerShell helpers
        run: python -m unittest discover -s tests
